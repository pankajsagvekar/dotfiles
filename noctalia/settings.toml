config_version = 14

[accessibility]
ui_scale = 1.2000000104308128

[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_padding = 7.0
    capsule_thickness = 0.76999998651444912
    center = [ "clock", "workspaces", "cat" ]
    end = [ "widget", "ram", "temp", "battery", "network", "notifications", "tray" ]
    font_scale = 1.0999999828636646
    margin_ends = 0
    radius_top_left = 0
    radius_top_right = 0
    scale = 1.1000000089406967
    start = [ "media" ]
    thickness = 40

