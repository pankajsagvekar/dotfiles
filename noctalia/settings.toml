[nightlight]
enabled = true
force = true

[osd]
scale = 1.1000000089406967

[plugin_settings."noctalia/wallpaper_depth"]
manager_open_near_click = true

[plugins]
auto_update = "all"
enabled = [ "noctalia/notes", "dotnetrob/cat", "thepunkoff/pomodoro" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.greeter_sync]
    privilege_command = "foot pkexec"

    [shell.panel]
    control_center_position = "center"
    open_near_click_control_center = true
    wallpaper_placement = "floating"
    wallpaper_position = "bottom_center"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Rosé Pine"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = [ "honeycomb", "stripes" ]
transition_on_startup = true

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/wallhaven-qrow67.png"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/wallhaven-qrow67.png"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/Wallpapers/wallhaven-qrow67.png"

    [[wallpaper.favorite]]
    path = "~/Pictures/Wallpapers/wallhaven-qrow67.png"
    theme_mode = "auto"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%I:%M %p}"

[widget.media]
color = "primary"
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false

[widget.ram]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
hide_when_empty = true
show_labels = false